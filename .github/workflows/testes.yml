name: Validações de qualidade de dados

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Testar as validações
        run: python -m pytest -v
      - name: Gerar relatório
        run: python validar.py
      - uses: actions/upload-artifact@v4
        with:
          name: relatorio-qualidade
          path: relatorios/relatorio-qualidade.md
